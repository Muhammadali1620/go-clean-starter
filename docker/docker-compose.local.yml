services:
  postgres-db:
    image: postgres:15-alpine
    container_name: new_project_db_local
    env_file:
      - ./../env/.env
    ports:
      - "5433:5432"
    volumes:
      - ./.volumes/pg_data:/var/lib/postgresql/data
    networks:
      - shared_network
    restart: unless-stopped

  redis-db:
    image: redis:7-alpine
    container_name: new_project_redis_local
    ports:
      - "6379:6379"
    volumes:
      - ./.volumes/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - shared_network
    restart: unless-stopped

networks:
  shared_network:
    driver: bridge
