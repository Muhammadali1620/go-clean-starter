services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: new_project_api
    container_name: new_project_api
    command: ["./new_project_app", "-mode=http"]
    env_file:
      - ./../env/.env
    ports:
      - "8080:8080"
    networks:
      - shared_network
    volumes:
      - ./../uploads:/app/uploads
      - ./../firebase-adminsdk.json:/app/firebase-adminsdk.json
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: new_project_bot
    container_name: app_bot
    command: ["./new_project_app", "-mode=bot"]
    env_file:
      - ./../env/.env
    networks:
      - shared_network
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: new_project_db
    env_file:
      - ./../env/.env
    ports:
      - "5433:5432"
    volumes:
      - ./.volumes/pg_data:/var/lib/postgresql/data
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

    restart: unless-stopped

  redis-db:
    image: redis:7-alpine
    container_name: new_project_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - ./.volumes/redis:/data
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: new_project_worker
    container_name: new_project_worker
    command: ["./new_project_app", "-mode=task-worker"]
    env_file:
      - ./../env/.env
    networks:
      - shared_network
    volumes:
      - ./../uploads:/app/uploads
      - ./../firebase-adminsdk.json:/app/firebase-adminsdk.json
    depends_on:
      redis-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: new_project_scheduler
    container_name: new_project_scheduler
    command: ["./new_project_app", "-mode=scheduler"]
    env_file:
      - ./../env/.env
    networks:
      - shared_network
    depends_on:
      redis-db:
        condition: service_healthy
    volumes:
      - ./../uploads:/app/uploads
      - ./../firebase-adminsdk.json:/app/firebase-adminsdk.json
    restart: unless-stopped

networks:
  shared_network:
    driver: bridge
